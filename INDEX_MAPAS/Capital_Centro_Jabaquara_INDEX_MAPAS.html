<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Capital Centro - Jabaquara</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-E59KMQFDEK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-E59KMQFDEK');

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
html, body, #map { height:100%; width:100%; margin:0; padding:0; font-family: Arial, sans-serif; }
.info-box{position:absolute;z-index:1000;top:10px;left:10px;background:white;padding:9px 11px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:13px;line-height:1.35;max-width:280px;}
.gps-box{position:absolute;z-index:1000;bottom:20px;left:10px;background:white;padding:8px 10px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:13px;max-width:320px;}
.btn{display:inline-block;margin-top:6px;padding:7px 10px;background:#222;color:#fff;border:0;border-radius:7px;cursor:pointer;font-weight:bold;font-size:12px;}
.legend{margin-top:6px;display:grid;grid-template-columns:auto 1fr;gap:4px 6px;align-items:center;}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #333;}
.dot.fin{background:#8B0000}.dot.car{background:#001F54}.dot.t2{background:#FFD400}.dot.t3{background:#40E0D0}
.marker-dot{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 3px rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;line-height:16px;}
.marker-fin{background:#8B0000;color:white;font-size:12px;}
.marker-car{background:#001F54;color:white;}
.marker-t2{background:#FFD400;color:#111;}
.marker-t3{background:#40E0D0;color:#111;}
.marker-outro{background:#777;color:white;}
.gps-marker{width:18px;height:18px;background:#1976d2;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 5px rgba(25,118,210,.25), 0 0 8px rgba(0,0,0,.6);}
.error{color:#8B0000;font-weight:bold;}
</style>
</head>
<body>
<div id="map"></div>
<div class="info-box">
  <b>Capital Centro - Jabaquara</b><br>
  Pontos: <span id="totalPontos">990</span><br>
  <span id="statusArea">GPS ainda não iniciado</span>
  <div class="legend">
    <span class="dot fin"></span><span>FINALIZADO: <span id="countFin">0</span></span>
    <span class="dot car"></span><span>CARTEIRA: <span id="countCar">0</span></span>
    <span class="dot t2"></span><span>T2: <span id="countT2">0</span></span>
    <span class="dot t3"></span><span>T3: <span id="countT3">0</span></span>
  </div>
  <button class="btn" onclick="centralizarGPS()">Minha localização</button>
</div>
<div class="gps-box" id="gpsInfo">Aguardando permissão do GPS...</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script>
const POLIGONO_URL = "../DADOS/AREAS_POLIGONOS/Capital Centro_Jabaquara.geojson";
const PONTOS_URL = "../DADOS/PONTOS_AREA/ER_REGIAO_CIDADE_min_Capital Centro_Jabaquara.geojson";

const map = L.map("map", { zoomControl: true, preferCanvas: true });

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

let areaGeojson = null;
let pontosGeojson = null;
let areaLayer = null;
let gpsLayer = null;

const cluster = L.markerClusterGroup({
  chunkedLoading: true,
  maxClusterRadius: 45,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false
});
map.addLayer(cluster);

function normalizarStatus(valor) {
  return String(valor || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .trim()
    .toUpperCase();
}

function classeStatus(status) {
  const s = normalizarStatus(status);
  if (s === "FINALIZADO") return "marker-fin";
  if (s === "CARTEIRA") return "marker-car";
  if (s.includes("T2")) return "marker-t2";
  if (s.includes("T3")) return "marker-t3";
  return "marker-outro";
}

function textoStatus(status) {
  const s = normalizarStatus(status);
  if (s === "FINALIZADO") return "×";
  if (s === "CARTEIRA") return "";
  if (s.includes("T2")) return "2";
  if (s.includes("T3")) return "3";
  return "";
}

function criarIcone(status) {
  return L.divIcon({
    className: "",
    html: `<div class="marker-dot ${classeStatus(status)}">${textoStatus(status)}</div>`,
    iconSize: [20, 20],
    iconAnchor: [10, 10],
    popupAnchor: [0, -10]
  });
}

function popupPonto(props) {
  const cnpj = props.CNPJ || "";
  const razao = props.RAZAOSOCIAL || props.RAZAO_SOCIAL || props.NOMEFANTASIA || "";
  const fantasia = props.NOMEFANTASIA || props.FANTASIA || "";
  const end = props.ENDEE || props.ENDERECO || "";
  const status = props.O_QUE_FAZER || "";
  const maps = props.LMAPS || "";
  const regiao = props.ER_REGIAO_CIDADE_min || props.ER_REGIAO_CIDADE || "";

  return `
    <b>${razao}</b><br>
    ${fantasia ? "Fantasia: " + fantasia + "<br>" : ""}
    ${cnpj ? "CNPJ: " + cnpj + "<br>" : ""}
    ${end ? "Endereço: " + end + "<br>" : ""}
    ${regiao ? "Região: " + regiao + "<br>" : ""}
    <b>Status:</b> ${status}<br>
    ${maps ? `<a href="${maps}" target="_blank">Abrir no Google Maps</a>` : ""}
  `;
}

function atualizarContadores(features) {
  let fin = 0, car = 0, t2 = 0, t3 = 0;
  features.forEach(f => {
    const s = normalizarStatus(f.properties?.O_QUE_FAZER);
    if (s === "FINALIZADO") fin++;
    else if (s === "CARTEIRA") car++;
    else if (s.includes("T2")) t2++;
    else if (s.includes("T3")) t3++;
  });

  document.getElementById("totalPontos").textContent = features.length;
  document.getElementById("countFin").textContent = fin;
  document.getElementById("countCar").textContent = car;
  document.getElementById("countT2").textContent = t2;
  document.getElementById("countT3").textContent = t3;
}

function carregarPontos(geojson) {
  cluster.clearLayers();

  geojson.features.forEach(feature => {
    if (!feature.geometry || feature.geometry.type !== "Point") return;

    const coords = feature.geometry.coordinates;
    const lon = coords[0];
    const lat = coords[1];
    const props = feature.properties || {};
    const status = props.O_QUE_FAZER;

    const marker = L.marker([lat, lon], { icon: criarIcone(status) });
    marker.bindPopup(popupPonto(props));
    cluster.addLayer(marker);
  });

  atualizarContadores(geojson.features);
}

function carregarPoligono(geojson) {
  areaGeojson = geojson;

  areaLayer = L.geoJSON(geojson, {
    style: {
      color: "#0057B8",
      weight: 3,
      opacity: 0.9,
      fillColor: "#0057B8",
      fillOpacity: 0.08
    },
    onEachFeature: function(feature, layer) {
      const p = feature.properties || {};
      const nome = p.ER_REGIAO_CIDADE || p.ER_REGIAO || "Capital Centro - Jabaquara";
      layer.bindPopup(`<b>${nome}</b>`);
    }
  }).addTo(map);

  const bounds = areaLayer.getBounds();
  if (bounds.isValid()) {
    map.fitBounds(bounds, { padding: [25, 25] });
  }
}

function pontoDentroDaArea(lat, lon) {
  if (!areaGeojson) return false;

  const ponto = turf.point([lon, lat]);

  for (const feature of areaGeojson.features) {
    try {
      if (turf.booleanPointInPolygon(ponto, feature)) return true;
    } catch (e) {
      console.warn("Erro ao validar polígono:", e);
    }
  }

  return false;
}

function centralizarGPS() {
  if (!navigator.geolocation) {
    document.getElementById("gpsInfo").innerHTML = '<span class="error">GPS não disponível neste navegador.</span>';
    return;
  }

  document.getElementById("gpsInfo").textContent = "Buscando localização...";

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const acc = Math.round(pos.coords.accuracy || 0);
      const dentro = pontoDentroDaArea(lat, lon);

      if (gpsLayer) map.removeLayer(gpsLayer);

      const gpsIcon = L.divIcon({
        className: "",
        html: '<div class="gps-marker"></div>',
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });

      gpsLayer = L.marker([lat, lon], { icon: gpsIcon }).addTo(map);
      gpsLayer.bindPopup(`<b>Minha localização</b><br>Precisão: ${acc} m<br>${dentro ? "Dentro da área" : "Fora da área"}`).openPopup();

      map.setView([lat, lon], 17);

      document.getElementById("statusArea").innerHTML = dentro
        ? "GPS: <b style='color:green'>dentro da área</b>"
        : "GPS: <b style='color:#8B0000'>fora da área</b>";

      document.getElementById("gpsInfo").innerHTML =
        `Lat: ${lat.toFixed(6)} | Lon: ${lon.toFixed(6)}<br>Precisão: ${acc} m`;
    },
    function() {
      document.getElementById("gpsInfo").innerHTML =
        '<span class="error">Não foi possível obter GPS. Verifique a permissão de localização.</span>';
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

async function iniciarMapa() {
  try {
    const [areaResp, pontosResp] = await Promise.all([
      fetch(POLIGONO_URL),
      fetch(PONTOS_URL)
    ]);

    if (!areaResp.ok || !pontosResp.ok) {
      throw new Error("Falha ao carregar GeoJSON");
    }

    areaGeojson = await areaResp.json();
    pontosGeojson = await pontosResp.json();

    carregarPoligono(areaGeojson);
    carregarPontos(pontosGeojson);

  } catch (e) {
    console.error(e);
    document.getElementById("gpsInfo").innerHTML =
      '<span class="error">Erro ao carregar dados. Confira os caminhos dos GeoJSON.</span>';
    map.setView([-23.55, -46.63], 11);
  }
}

iniciarMapa();
</script>
</body>
</html>
