function search(){show('Buscar CNPJ, empresa ou endereço','<input id="q" aria-label="Texto da busca" placeholder="CNPJ, razão social, fantasia ou endereço"><div id="results" class="foot">Também permite buscar endereço público (Nominatim).</div>');const el=document.getElementById('q');el.focus();let last='';el.addEventListener('input',()=>{let q=norm(el.value),res=document.getElementById('results');if(q.length<2){res.textContent='Digite ao menos 2 caracteres.';return}last=q;const found=index.filter(x=>x.query.includes(q)).slice(0,30);res.innerHTML=found.map((x,i)=>'<button class="result" data-i="'+i+'">'+E(nameOf(x.p))+' · '+E(prop(x.p,['CNPJ']))+'<br>'+E(prop(x.p,['ENDEE','ENDERECO']))+'</button>').join('')+(found.length===30?'<p>Mostrando os 30 primeiros resultados.</p>':'')+'<button id="addr" class="result">🌎 Buscar este texto como endereço público</button>';res.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>showPoint(found[Number(b.dataset.i)]));document.getElementById('addr').onclick=()=>externalAddress(el.value,last)})}async function externalAddress(term,q){let res=document.getElementById('results');res.textContent='Buscando no OpenStreetMap...';try{const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=br&q='+encodeURIComponent(term);const r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(norm(document.getElementById('q')?.value)!==q)return;res.innerHTML=data.length?data.map((x,i)=>'<button class="result" data-a="'+i+'">'+E(x.display_name)+'</button>').join(''):'Nenhum endereço encontrado.';res.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{let x=data[Number(b.dataset.a)];hide();map.setView([+x.lat,+x.lon],17);L.popup().setLatLng([+x.lat,+x.lon]).setContent(E(x.display_name)).openOn(map)})}catch(e){res.textContent='Não foi possível acessar o Nominatim. Verifique a conexão.'}}document.getElementById('searchButton').onclick=search;document.getElementById('helpButton').onclick=()=>show('Tutorial do mapa','<ol><li><b>Minha localização:</b> autorize o GPS para visualizar o ponto azul, a precisão e o rastro de deslocamento.</li><li><b>Próximo ponto:</b> identifica a empresa mais próxima em linha reta e oferece rota no Google Maps.</li><li><b>Lupa:</b> busca CNPJ, empresa, endereço cadastrado ou endereço público via Nominatim.</li><li><b>Legenda:</b> identifica o status Carteira Oxigena.</li><li><b>Centralizar:</b> retorna à área operacional.</li><li><b>Orientação:</b> usa bússola do dispositivo quando o navegador permite e orienta o mapa.</li><li><b>Empresa:</b> toque no marcador para consultar <b>todos os campos</b> disponíveis no GeoJSON e os links de navegação.</li></ol><p class="small">Trajeto pelo Google Maps, não calculado neste HTML. GPS e orientação exigem permissão do aparelho.</p>');
let compass=false,headingDegrees=0;document.getElementById('orientButton').onclick=async()=>{if(compass){compass=false;map.getContainer().style.transform='';show('Orientação','Orientação desligada.');return}if(typeof DeviceOrientationEvent==='undefined'){show('Orientação','O dispositivo não oferece orientação por bússola.');return}try{if(typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw Error('Permissão negada')}compass=true;show('Orientação','Bússola ativada, se o navegador fornecer direção. O mapa permanece orientado ao norte para preservar controles e coordenadas.');}catch(e){show('Orientação','Não foi possível ativar a bússola: '+E(e.message))}};
