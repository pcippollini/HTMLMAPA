<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resumo por Região | São Paulo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif}body{display:flex;flex-direction:column;color:#17283b}
header{min-height:54px;background:#123d68;color:white;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;z-index:500}
header strong{font-size:15px}#contagem{font-size:12px;white-space:nowrap;color:#d9e6f3}#mapa{flex:1;min-height:200px;background:#e4edf2}
#aviso{position:absolute;z-index:600;top:70px;left:50%;transform:translateX(-50%);padding:11px 15px;background:white;box-shadow:0 2px 14px #0002;border-radius:8px;font-size:13px;max-width:calc(100% - 30px)}
#aviso[hidden]{display:none}.leaflet-container{font-family:Arial,Helvetica,sans-serif}.leaflet-popup-content{margin:0;width:268px!important}.leaflet-popup-content-wrapper{padding:0;border-radius:11px;overflow:hidden}.leaflet-popup-close-button{color:white!important;top:9px!important;right:9px!important;font-size:22px!important}.pop-titulo{background:#123d68;color:white;padding:13px 32px 12px 14px}.pop-titulo b{font-size:15px;display:block}.pop-titulo small{display:block;margin-top:4px;color:#d5e5f2}.pop-itens{padding:9px 14px;max-height:54vh;overflow-y:auto}.pop-item{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:6px 0;border-bottom:1px solid #edf1f5;font-size:12px}.pop-item:last-child{border-bottom:0}.pop-item b{font-size:14px;color:#123d68}
@media(max-width:480px){header{padding:10px}header strong{font-size:13px}#contagem{font-size:11px}.leaflet-popup-content{width:245px!important}}
</style>
</head>
<body>
<header><strong>Resumo de status por região</strong><span id="contagem">Carregando...</span></header>
<div id="mapa"></div><div id="aviso">Carregando regiões...</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
// Arquivo publicado na pasta DADOS, ao lado da pasta raiz que contém este HTML.
const ARQUIVO='./DADOS/RESUMO_REGIÃO_1910.geojson';
const CAMPOS=['T2','T3','T4','T5','M1','M2','CARTEIRA','CARTEIRA - DESENVOLVE','CARTEIRA - FAMPE','FINALIZADO'];
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const numero=v=>Number.isFinite(Number(v))?Number(v).toLocaleString('pt-BR'):'—';
const map=L.map('mapa',{preferCanvas:true,zoomControl:true,zoomSnap:.5}).setView([-22.8,-48.5],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(map);
const canvas=L.canvas({padding:.2});
const padrao={renderer:canvas,color:'#2776a2',weight:1,opacity:.8,fillColor:'#409ac5',fillOpacity:.19};
const ativo={color:'#d97706',weight:2.6,fillColor:'#ffc168',fillOpacity:.5};
let atual=null,layerGeo=null;
function popup(p){
 let nome=esc(p.ER_REGIAO||p.REGIAO||'Região');
 let local=esc(p.NM_MUN||'');
 return `<div class="pop-titulo"><b>${nome}</b><small>${local}</small></div><div class="pop-itens">${CAMPOS.map(k=>`<div class="pop-item"><span>${esc(k)}</span><b>${numero(p[k])}</b></div>`).join('')}</div>`;
}
async function iniciar(){
 try {
  const resposta=await fetch(ARQUIVO);
  if(!resposta.ok)throw new Error('HTTP '+resposta.status);
  const dados=await resposta.json();
  if(dados.type!=='FeatureCollection'||!Array.isArray(dados.features))throw new Error('GeoJSON inválido');
  // Popups gerados somente no clique; sem eventos de mouseover para cada polígono.
  layerGeo=L.geoJSON(dados,{style:()=>padrao,onEachFeature:(f,layer)=>{
   layer.on('click',()=>{
    if(atual&&atual!==layer)atual.setStyle(padrao);
    atual=layer;layer.setStyle(ativo);
    layer.bindPopup(popup(f.properties||{}),{maxWidth:285,autoPan:true}).openPopup();
   });
  }}).addTo(map);
  const bounds=layerGeo.getBounds();if(bounds.isValid())map.fitBounds(bounds,{padding:[12,12]});
  document.getElementById('contagem').textContent=dados.features.length.toLocaleString('pt-BR')+' regiões';
  document.getElementById('aviso').hidden=true;
  map.on('popupclose',()=>{if(atual){atual.setStyle(padrao);atual=null;}});
 }catch(e){
  console.error(e);const aviso=document.getElementById('aviso');
  aviso.textContent='Não foi possível abrir DADOS/RESUMO_REGIÃO_1910.geojson. Confira se os dois arquivos foram enviados nas pastas corretas ao GitHub Pages. Detalhes: '+e.message;
  document.getElementById('contagem').textContent='Falha no GeoJSON';
 }
}
iniciar();
</script>
</body></html>
