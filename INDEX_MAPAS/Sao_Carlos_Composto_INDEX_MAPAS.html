<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>São Carlos - Composto</title>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E59KMQFDEK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-E59KMQFDEK');
  </script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

  <style>
    :root {
      --finalizado:#8B0000;
      --carteira:#001F54;
      --t2:#FFD400;
      --t3:#40E0D0;
      --painel:#111827;
      --texto:#F9FAFB;
    }
    * { box-sizing:border-box; }
    html,body,#map { width:100%; height:100%; margin:0; }
    body { font-family:Arial,sans-serif; overflow:hidden; }
    #map { background:#ddd; }

    .painel {
      position:absolute; z-index:1000; top:10px; left:10px;
      width:min(340px,calc(100vw - 20px)); padding:12px;
      color:var(--texto); background:rgba(17,24,39,.96);
      border-radius:12px; box-shadow:0 4px 18px rgba(0,0,0,.35);
    }
    .titulo { font-size:16px; font-weight:700; margin-bottom:8px; }
    .contadores {
      display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
      gap:6px; margin:8px 0;
    }
    .card {
      padding:7px 8px; border-radius:8px; background:#263244;
      font-size:12px;
    }
    .card strong { display:block; font-size:18px; }
    .linha { display:flex; align-items:center; gap:7px; margin:4px 0; font-size:12px; }
    .bolinha { width:12px; height:12px; border-radius:50%; border:1px solid #fff; flex:0 0 12px; }
    .btn {
      width:100%; margin-top:8px; padding:9px; border:0;
      border-radius:8px; font-weight:700; cursor:pointer;
    }
    .status { margin-top:7px; font-size:12px; }
    .aviso { color:#FACC15; }
    .erro { color:#FCA5A5; }

    .ponto {
      width:17px; height:17px; border-radius:50%;
      border:2px solid white; box-shadow:0 1px 4px rgba(0,0,0,.8);
      display:flex; align-items:center; justify-content:center;
      font:700 10px Arial;
    }
    .gps {
      width:18px; height:18px; border-radius:50%;
      background:#2563EB; border:3px solid white;
      box-shadow:0 0 0 6px rgba(37,99,235,.25);
    }
    .popup a { font-weight:700; }
    @media(max-width:600px){
      .painel { top:6px; left:6px; width:calc(100vw - 12px); }
      .contadores { grid-template-columns:repeat(5,minmax(0,1fr)); }
      .card { text-align:center; padding:5px 3px; }
      .card strong { font-size:15px; }
    }
  </style>
</head>
<body>
<div id="map"></div>

<section class="painel">
  <div class="titulo">São Carlos — mapa composto</div>

  <div class="contadores">
    <div class="card">TOTAL<strong id="cTotal">0</strong></div>
    <div class="card">FINALIZADO<strong id="cFinalizado">0</strong></div>
    <div class="card">CARTEIRA<strong id="cCarteira">0</strong></div>
    <div class="card">T2<strong id="cT2">0</strong></div>
    <div class="card">T3<strong id="cT3">0</strong></div>
  </div>

  <div class="linha"><span class="bolinha" style="background:var(--finalizado)"></span>Finalizado</div>
  <div class="linha"><span class="bolinha" style="background:var(--carteira)"></span>Carteira</div>
  <div class="linha"><span class="bolinha" style="background:var(--t2)"></span>Aplicar T2</div>
  <div class="linha"><span class="bolinha" style="background:var(--t3)"></span>Aplicar T3</div>

  <button class="btn" id="btnGps">Minha localização</button>
  <div class="status" id="status">Carregando polígonos e pontos...</div>
  <div class="status aviso">Santa Eudóxia está incluída como área, mesmo sem arquivo de pontos.</div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<script>
const CAMADAS_POLIGONO = [
  { nome: "ER_REGIAO_São Carlos_Água Vermelha.geojson", arquivo: "../DADOS/AREAS_POLIGONOS/ER_REGIAO_São Carlos_Água Vermelha.geojson" },
  { nome: "ER_REGIAO_São Carlos_Bela Vista São-Carlense.geojson", arquivo: "../DADOS/AREAS_POLIGONOS/ER_REGIAO_São Carlos_Bela Vista São-Carlense.geojson" },
  { nome: "ER_REGIAO_São Carlos_Santa Eudóxia.geojson", arquivo: "../DADOS/AREAS_POLIGONOS/ER_REGIAO_São Carlos_Santa Eudóxia.geojson" },
  { nome: "ER_REGIAO_São Carlos_São Carlos.geojson", arquivo: "../DADOS/AREAS_POLIGONOS/ER_REGIAO_São Carlos_São Carlos.geojson" },
  { nome: "ER_REGIAO_São Carlos_Vila Nery.geojson", arquivo: "../DADOS/AREAS_POLIGONOS/ER_REGIAO_São Carlos_Vila Nery.geojson" }
];

const CAMADAS_PONTOS = [
  { nome: "ER_REGIAO_CIDADE_min_São Carlos_Água Vermelha_São Carlos.geojson", arquivo: "../DADOS/PONTOS_AREA/ER_REGIAO_CIDADE_min_São Carlos_Água Vermelha_São Carlos.geojson" },
  { nome: "ER_REGIAO_CIDADE_min_São Carlos_Bela Vista São-Carlense_São Carlos.geojson", arquivo: "../DADOS/PONTOS_AREA/ER_REGIAO_CIDADE_min_São Carlos_Bela Vista São-Carlense_São Carlos.geojson" },
  { nome: "ER_REGIAO_CIDADE_min_São Carlos_São Carlos_São Carlos.geojson", arquivo: "../DADOS/PONTOS_AREA/ER_REGIAO_CIDADE_min_São Carlos_São Carlos_São Carlos.geojson" },
  { nome: "ER_REGIAO_CIDADE_min_São Carlos_Vila Nery_São Carlos.geojson", arquivo: "../DADOS/PONTOS_AREA/ER_REGIAO_CIDADE_min_São Carlos_Vila Nery_São Carlos.geojson" }
];

const CORES = {
  FINALIZADO:'#8B0000',
  CARTEIRA:'#001F54',
  T2:'#FFD400',
  T3:'#40E0D0',
  OUTRO:'#6B7280'
};

const map = L.map('map', { preferCanvas:true, zoomControl:true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19,
  attribution:'&copy; OpenStreetMap'
}).addTo(map);

const grupoAreas = L.featureGroup().addTo(map);
const grupoPontos = L.markerClusterGroup({
  chunkedLoading:true,
  maxClusterRadius:45,
  disableClusteringAtZoom:17
}).addTo(map);

const areasCarregadas = [];
let gpsMarker = null;
let gpsAccuracy = null;
let ultimaPosicao = null;

function normalizar(valor) {
  return String(valor ?? '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .trim()
    .toUpperCase();
}

function categoria(status) {
  const s = normalizar(status);
  if (s === 'FINALIZADO') return 'FINALIZADO';
  if (s === 'CARTEIRA') return 'CARTEIRA';
  if (s.includes('T2')) return 'T2';
  if (s.includes('T3')) return 'T3';
  return 'OUTRO';
}

function icone(status) {
  const cat = categoria(status);
  const texto = cat === 'T2' ? '2' : cat === 'T3' ? '3' : cat === 'FINALIZADO' ? '✓' : '';
  const corTexto = (cat === 'T2' || cat === 'T3') ? '#111' : '#fff';
  return L.divIcon({
    className:'',
    html:`<div class="ponto" style="background:${CORES[cat]};color:${corTexto}">${texto}</div>`,
    iconSize:[21,21],
    iconAnchor:[10,10],
    popupAnchor:[0,-10]
  });
}

function valor(props, nomes) {
  for (const nome of nomes) {
    if (props[nome] !== undefined && props[nome] !== null && String(props[nome]).trim() !== '') {
      return props[nome];
    }
  }
  return '';
}

function popupPonto(feature, latlng) {
  const p = feature.properties || {};
  const nome = valor(p,['NOME_FANTASIA','NOMEFANTASIA','FANTASIA','RAZAO_SOCIAL','RAZAOSOCIAL']) || 'Ponto';
  const cnpj = valor(p,['CNPJ','NR_CNPJ']);
  const endereco = valor(p,['ENDERECO_COMPLETO','ENDERECO','ENDEE']);
  const cidade = valor(p,['CIDADE','MUNICIPIO','NM_MUN']);
  const agente = valor(p,['AGENTE','NOME_AGENTE']);
  const status = valor(p,['O_QUE_FAZER']);
  const maps = `https://www.google.com/maps/search/?api=1&query=${latlng.lat},${latlng.lng}`;

  return `<div class="popup">
    <b>${nome}</b><br>
    ${cnpj ? `<b>CNPJ:</b> ${cnpj}<br>` : ''}
    ${endereco ? `<b>Endereço:</b> ${endereco}<br>` : ''}
    ${cidade ? `<b>Cidade:</b> ${cidade}<br>` : ''}
    ${agente ? `<b>Agente:</b> ${agente}<br>` : ''}
    <b>Status:</b> ${status || 'Não informado'}<br><br>
    <a href="${maps}" target="_blank" rel="noopener">Abrir no Google Maps</a>
  </div>`;
}

async function buscarJson(caminho) {
  const resposta = await fetch(encodeURI(caminho));
  if (!resposta.ok) throw new Error(`${resposta.status} — ${caminho}`);
  return resposta.json();
}

async function carregarAreas() {
  const resultados = await Promise.allSettled(
    CAMADAS_POLIGONO.map(async item => {
      const geojson = await buscarJson(item.arquivo);
      areasCarregadas.push(geojson);

      const layer = L.geoJSON(geojson, {
        style: {
          color:'#123D68',
          weight:3,
          fillColor:'#123D68',
          fillOpacity:.10
        },
        onEachFeature: (feature, camada) => {
          const p = feature.properties || {};
          const nome = valor(p,['NOME_REGIAO','REGIAO','NM_MUN']) || item.nome.replace('.geojson','');
          const agente = valor(p,['AGENTE','NOME_AGENTE']);
          camada.bindPopup(`<b>${nome}</b>${agente ? `<br><b>Agente:</b> ${agente}` : ''}`);
        }
      });

      layer.addTo(grupoAreas);
      return item.nome;
    })
  );
  return resultados;
}

async function carregarPontos() {
  const cont = {TOTAL:0, FINALIZADO:0, CARTEIRA:0, T2:0, T3:0};

  const resultados = await Promise.allSettled(
    CAMADAS_PONTOS.map(async item => {
      const geojson = await buscarJson(item.arquivo);
      const features = Array.isArray(geojson.features) ? geojson.features : [];

      features.forEach(feature => {
        cont.TOTAL++;
        const cat = categoria((feature.properties || {}).O_QUE_FAZER);
        if (cont[cat] !== undefined) cont[cat]++;
      });

      L.geoJSON(geojson, {
        pointToLayer:(feature, latlng) =>
          L.marker(latlng, {icon:icone((feature.properties || {}).O_QUE_FAZER)}),
        onEachFeature:(feature, layer) => {
          const latlng = layer.getLatLng();
          layer.bindPopup(popupPonto(feature,latlng));
        }
      }).eachLayer(layer => grupoPontos.addLayer(layer));

      return item.nome;
    })
  );

  document.getElementById('cTotal').textContent = cont.TOTAL;
  document.getElementById('cFinalizado').textContent = cont.FINALIZADO;
  document.getElementById('cCarteira').textContent = cont.CARTEIRA;
  document.getElementById('cT2').textContent = cont.T2;
  document.getElementById('cT3').textContent = cont.T3;

  return resultados;
}

function estaDentro(lat,lng) {
  const ponto = turf.point([lng,lat]);
  return areasCarregadas.some(geojson =>
    (geojson.features || []).some(feature => {
      const tipo = feature?.geometry?.type;
      return (tipo === 'Polygon' || tipo === 'MultiPolygon') &&
        turf.booleanPointInPolygon(ponto,feature);
    })
  );
}

function atualizarGPS(pos) {
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  const precisao = Math.round(pos.coords.accuracy || 0);
  ultimaPosicao = L.latLng(lat,lng);

  if (!gpsMarker) {
    gpsMarker = L.marker(ultimaPosicao,{
      icon:L.divIcon({className:'',html:'<div class="gps"></div>',iconSize:[24,24],iconAnchor:[12,12]})
    }).addTo(map);

    gpsAccuracy = L.circle(ultimaPosicao,{
      radius:precisao,color:'#2563EB',weight:1,fillOpacity:.08
    }).addTo(map);
  } else {
    gpsMarker.setLatLng(ultimaPosicao);
    gpsAccuracy.setLatLng(ultimaPosicao).setRadius(precisao);
  }

  document.getElementById('status').innerHTML =
    `${estaDentro(lat,lng) ? '🟢 Dentro de uma área' : '🔴 Fora das áreas'} · precisão aproximada: ${precisao} m`;
}

function iniciarGPS() {
  if (!navigator.geolocation) {
    document.getElementById('status').textContent = 'GPS não suportado neste navegador.';
    return;
  }

  navigator.geolocation.watchPosition(
    atualizarGPS,
    () => document.getElementById('status').textContent = 'GPS não autorizado ou indisponível.',
    {enableHighAccuracy:true,maximumAge:3000,timeout:15000}
  );
}

document.getElementById('btnGps').addEventListener('click', () => {
  if (ultimaPosicao) map.setView(ultimaPosicao,17);
  else iniciarGPS();
});

(async function iniciar() {
  try {
    const [areasResultado,pontosResultado] = await Promise.all([
      carregarAreas(),
      carregarPontos()
    ]);

    if (grupoAreas.getBounds().isValid()) {
      map.fitBounds(grupoAreas.getBounds(),{padding:[20,20]});
    } else {
      map.setView([-22.02,-47.89],11);
    }

    const errosArea = areasResultado.filter(r => r.status === 'rejected').length;
    const errosPonto = pontosResultado.filter(r => r.status === 'rejected').length;

    document.getElementById('status').textContent =
      errosArea || errosPonto
        ? `Mapa carregado com pendências: ${errosArea} área(s) e ${errosPonto} arquivo(s) de pontos não carregados.`
        : 'Mapa carregado. Ative “Minha localização” para validar sua posição.';

    iniciarGPS();
  } catch (erro) {
    console.error(erro);
    document.getElementById('status').innerHTML =
      '<span class="erro">Erro ao carregar o mapa. Confira os nomes e caminhos dos GeoJSON.</span>';
    map.setView([-22.02,-47.89],11);
  }
})();
</script>
</body>
</html>
