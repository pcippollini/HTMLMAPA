function normalizar(v){ return String(v || '').trim().toUpperCase(); }
function iconPorStatus(status){
  const s = normalizar(status);
  let cls = 'ponto ponto-default';
  if (s === 'FINALIZADO') cls = 'ponto ponto-finalizado';
  else if (s === 'CARTEIRA') cls = 'ponto ponto-carteira';
  else if (s === 'T2') cls = 'ponto-texto ponto-t2';
  else if (s === 'T3') cls = 'ponto-texto ponto-t3';
  return L.divIcon({ className: cls, iconSize:[18,18], iconAnchor:[9,9], popupAnchor:[0,-8] });
}

function popupPonto(p){
  const nome = p.NOMEFANTASIA || p.RAZAOSOCIAL || 'Ponto';
  const end = p.ENDEE || '';
  const cnpj = p.CNPJ || '';
  const status = p.O_QUE_FAZER || '';
  const lat = p.LATITUDE || '';
  const lon = p.LONGITUDE || '';
  const gmaps = (lat && lon) ? `https://www.google.com/maps?q=${lat},${lon}` : (p.LMAPS || '#');
  return `<div class="popup"><b>${nome}</b><br>Status: ${status}<br>CNPJ: ${cnpj}<br>${end}<br><a href="${gmaps}" target="_blank">Abrir no Google Maps</a></div>`;
}

  pointToLayer: function(feature, latlng){
    total++;
    return L.marker(latlng, { icon: iconPorStatus(feature.properties.O_QUE_FAZER) });
  },
  onEachFeature: function(feature, layer){ layer.bindPopup(popupPonto(feature.properties || {})); }
}).eachLayer(layer => cluster.addLayer(layer));
cluster.addTo(map);
document.getElementById('qtdPontos').innerText = total;

let gpsMarker = null;
let gpsAccuracy = null;
let ultimaPosicao = null;

const gpsIcon = L.divIcon({ className:'gps-dot', iconSize:[18,18], iconAnchor:[9,9] });

function verificarDentro(lat, lng){
  try {
    const pt = turf.point([lng, lat]);
    return turf.booleanPointInPolygon(pt, areaGeoJSON.features[0]);
  } catch(e) { return null; }
}

function atualizarGPS(pos){
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  const acc = pos.coords.accuracy || 0;
  ultimaPosicao = [lat, lng];
  if (!gpsMarker) gpsMarker = L.marker([lat,lng], { icon:gpsIcon, zIndexOffset:1000 }).addTo(map).bindPopup('Você está aqui');
  else gpsMarker.setLatLng([lat,lng]);
  if (!gpsAccuracy) gpsAccuracy = L.circle([lat,lng], { radius:acc, color:'#0078ff', weight:1, fillOpacity:0.08 }).addTo(map);
  else gpsAccuracy.setLatLng([lat,lng]).setRadius(acc);
  const dentro = verificarDentro(lat,lng);
  const el = document.getElementById('gpsStatus');
  if (dentro === true) { el.innerHTML = 'GPS: <span class="dentro">dentro da área</span>'; }
  else if (dentro === false) { el.innerHTML = 'GPS: <span class="fora">fora da área</span>'; }
  else { el.innerText = 'GPS: posição encontrada'; }
}

function erroGPS(err){
  document.getElementById('gpsStatus').innerText = 'GPS: permita a localização no celular';
}

function centralizarUsuario(){
  if (ultimaPosicao) map.setView(ultimaPosicao, 17);
  else if (navigator.geolocation) navigator.geolocation.getCurrentPosition(function(pos){ atualizarGPS(pos); map.setView([pos.coords.latitude, pos.coords.longitude], 17); }, erroGPS, {enableHighAccuracy:true, timeout:10000});
}

if (navigator.geolocation) {
  navigator.geolocation.watchPosition(atualizarGPS, erroGPS, { enableHighAccuracy:true, maximumAge:5000, timeout:15000 });
} else {
  document.getElementById('gpsStatus').innerText = 'GPS: navegador não compatível';
}
</script>
</body>
</html>
