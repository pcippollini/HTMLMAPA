<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>São Paulo - Cangaiba</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-E59KMQFDEK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-E59KMQFDEK');
</script>


<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<style>
html, body, #map { height:100%; width:100%; margin:0; padding:0; font-family: Arial, sans-serif; }
.info-box{position:absolute;z-index:1000;top:10px;left:10px;background:white;padding:9px 11px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:13px;line-height:1.35;max-width:310px;}
.gps-box{position:absolute;z-index:1000;bottom:20px;left:10px;background:white;padding:8px 10px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:13px;max-width:310px;}
.btn{display:inline-block;margin-top:6px;padding:7px 10px;background:#222;color:#fff;border:0;border-radius:7px;cursor:pointer;font-weight:bold;font-size:12px;}
.legend{margin-top:6px;display:grid;grid-template-columns:auto 1fr;gap:4px 6px;align-items:center;}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #333;}
.dot.fin{background:#8B0000}.dot.car{background:#001F54}.dot.t2{background:#FFD400}.dot.t3{background:#40E0D0}
.marker-dot{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 3px rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;line-height:16px;}
.marker-fin{background:#8B0000;color:white;font-size:12px;}
.marker-car{background:#001F54;color:white;}
.marker-t2{background:#FFD400;color:#111;}
.marker-t3{background:#40E0D0;color:#111;}
.marker-outro{background:#777;color:white;}
.gps-marker{width:18px;height:18px;background:#1976d2;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 5px rgba(25,118,210,.25), 0 0 8px rgba(0,0,0,.6);}
.leaflet-popup-content{font-size:13px;}
</style>
</head>

<body>
<div id="map"></div>

<div class="info-box">
  <b>São Paulo - Cangaiba</b><br>
  Polígonos: <span id="totalPoligonos">1</span><br>
  Pontos: <span id="totalPontos">437</span><br>
  <span id="statusArea">GPS ainda não iniciado</span>

  <div class="legend">
    <span class="dot fin"></span><span>FINALIZADO: <b id="countFin">0</b></span>
    <span class="dot car"></span><span>CARTEIRA: <b id="countCar">0</b></span>
    <span class="dot t2"></span><span>T2: <b id="countT2">0</b></span>
    <span class="dot t3"></span><span>T3: <b id="countT3">0</b></span>
  </div>

  <button class="btn" onclick="centralizarGPS()">Minha localização</button>
</div>

<div class="gps-box" id="gpsInfo">Aguardando permissão do GPS...</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<script>
const POLIGONO = "../DADOS/AREAS_POLIGONOS/São Paulo_Cangaiba.geojson";
const PONTOS = "../DADOS/PONTOS_AREA/ER_REGIAO_CIDADE_min_São Paulo_Cangaiba.geojson";

const map = L.map("map", { zoomControl:true }).setView([-23.58, -46.58], 12);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 20,
  attribution: "Leaflet | © OpenStreetMap"
}).addTo(map);

const polygonGroup = L.featureGroup().addTo(map);
const clusterGroup = L.markerClusterGroup({
  chunkedLoading: true,
  maxClusterRadius: 45,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false
}).addTo(map);

let polygonFeatures = [];
let gpsMarker = null;
let lastLatLng = null;

const totais = {
  pontos: 0,
  FINALIZADO: 0,
  CARTEIRA: 0,
  T2: 0,
  T3: 0
};

function normalizarStatus(valor) {
  const s = String(valor || "").trim().toUpperCase();
  if (s === "FINALIZADO") return "FINALIZADO";
  if (s === "CARTEIRA") return "CARTEIRA";
  if (s === "APLICAR T2" || s === "T2") return "T2";
  if (s === "APLICAR T3" || s === "T3") return "T3";
  return "OUTRO";
}

function iconPorStatus(status) {
  const st = normalizarStatus(status);
  let cls = "marker-outro";
  let txt = "";
  if (st === "FINALIZADO") { cls = "marker-fin"; txt = "×"; }
  if (st === "CARTEIRA") { cls = "marker-car"; txt = ""; }
  if (st === "T2") { cls = "marker-t2"; txt = "2"; }
  if (st === "T3") { cls = "marker-t3"; txt = "3"; }

  return L.divIcon({
    className: "",
    html: `<div class="marker-dot ${cls}">${txt}</div>`,
    iconSize: [20, 20],
    iconAnchor: [10, 10],
    popupAnchor: [0, -10]
  });
}

function gpsIcon() {
  return L.divIcon({
    className: "",
    html: `<div class="gps-marker"></div>`,
    iconSize: [24, 24],
    iconAnchor: [12, 12]
  });
}

function valorCampo(props, nomes) {
  for (const n of nomes) {
    if (props[n] !== undefined && props[n] !== null && String(props[n]).trim() !== "") return props[n];
  }
  return "";
}

function montarPopupPonto(props) {
  const cnpj = valorCampo(props, ["CNPJ"]);
  const razao = valorCampo(props, ["RAZAOSOCIAL", "RAZAO_SOCIAL", "RAZÃO_SOCIAL"]);
  const fantasia = valorCampo(props, ["FANTASIA", "NOME_FANTASIA"]);
  const endereco = valorCampo(props, ["ENDEE", "ENDERECO", "ENDEREÇO"]);
  const status = valorCampo(props, ["O_QUE_FAZER"]);

  return `
    <b>${razao || fantasia || "Ponto"}</b><br>
    ${cnpj ? `<b>CNPJ:</b> ${cnpj}<br>` : ""}
    ${fantasia ? `<b>Fantasia:</b> ${fantasia}<br>` : ""}
    ${endereco ? `<b>Endereço:</b> ${endereco}<br>` : ""}
    <b>Status:</b> ${status || "-"}<br>
    <b>Região:</b> São Paulo - Cangaiba
  `;
}

function atualizarPainel() {
  document.getElementById("totalPontos").textContent = totais.pontos;
  document.getElementById("countFin").textContent = totais.FINALIZADO;
  document.getElementById("countCar").textContent = totais.CARTEIRA;
  document.getElementById("countT2").textContent = totais.T2;
  document.getElementById("countT3").textContent = totais.T3;
}

function pontoDentroDoPoligono(lat, lng) {
  const pt = turf.point([lng, lat]);
  for (const feature of polygonFeatures) {
    try {
      if (turf.booleanPointInPolygon(pt, feature)) return true;
    } catch(e) {}
  }
  return false;
}

function avaliarGPS(lat, lng) {
  const dentro = pontoDentroDoPoligono(lat, lng);
  const statusEl = document.getElementById("statusArea");
  const gpsInfo = document.getElementById("gpsInfo");

  if (dentro) {
    statusEl.innerHTML = `GPS: <b style="color:#0a7d26">dentro da área</b>`;
    gpsInfo.innerHTML = `GPS dentro da área: <b>São Paulo - Cangaiba</b>`;
  } else {
    statusEl.innerHTML = `GPS: <b style="color:#8B0000">fora da área</b>`;
    gpsInfo.innerHTML = "GPS fora da área carregada.";
  }
}

function centralizarGPS() {
  if (!navigator.geolocation) {
    document.getElementById("gpsInfo").textContent = "GPS não suportado neste navegador.";
    return;
  }

  document.getElementById("gpsInfo").textContent = "Obtendo localização...";

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      lastLatLng = [lat, lng];

      if (!gpsMarker) {
        gpsMarker = L.marker(lastLatLng, {icon:gpsIcon(), zIndexOffset:1000}).addTo(map);
      } else {
        gpsMarker.setLatLng(lastLatLng);
      }

      map.setView(lastLatLng, 16);
      avaliarGPS(lat, lng);
    },
    () => {
      document.getElementById("gpsInfo").textContent = "Não foi possível obter a localização. Verifique a permissão do GPS.";
    },
    {enableHighAccuracy:true, timeout:12000, maximumAge:0}
  );
}

async function carregarGeoJSON(url) {
  const resposta = await fetch(url);
  if (!resposta.ok) throw new Error(`Erro ${resposta.status} ao carregar ${url}`);
  return await resposta.json();
}

function estiloPoligono() {
  return {
    color: "#001F54",
    weight: 3,
    opacity: 0.95,
    fillColor: "#40E0D0",
    fillOpacity: 0.18
  };
}

async function iniciar() {
  try {
    const [areaGeojson, pontosGeojson] = await Promise.all([
      carregarGeoJSON(POLIGONO),
      carregarGeoJSON(PONTOS)
    ]);

    const areaLayer = L.geoJSON(areaGeojson, {
      style: estiloPoligono,
      onEachFeature: function(feature, layer) {
        const p = feature.properties || {};
        const nome = p.ER_REGIAO_CIDADE || p.ER_REGIAO || "São Paulo - Cangaiba";
        layer.bindPopup(`<b>${nome}</b>`);
      }
    }).addTo(polygonGroup);

    polygonFeatures = areaGeojson.features || [];

    (pontosGeojson.features || []).forEach(feature => {
      if (!feature.geometry || feature.geometry.type !== "Point") return;

      const coords = feature.geometry.coordinates;
      const lng = coords[0];
      const lat = coords[1];
      const props = feature.properties || {};
      const status = normalizarStatus(props.O_QUE_FAZER);

      if (status in totais) totais[status]++;
      totais.pontos++;

      const marker = L.marker([lat, lng], {icon: iconPorStatus(status)});
      marker.bindPopup(montarPopupPonto(props));
      clusterGroup.addLayer(marker);
    });

    atualizarPainel();

    const bounds = polygonGroup.getBounds();
    if (bounds.isValid()) {
      map.fitBounds(bounds, {padding:[25,25]});
    } else if (clusterGroup.getBounds().isValid()) {
      map.fitBounds(clusterGroup.getBounds(), {padding:[25,25]});
    }
  } catch (erro) {
    console.error(erro);
    document.getElementById("statusArea").innerHTML =
      `<span style="color:#8B0000">Erro ao carregar dados.</span>`;
    document.getElementById("gpsInfo").textContent = erro.message;
  }
}

iniciar();
</script>
</body>
</html>
