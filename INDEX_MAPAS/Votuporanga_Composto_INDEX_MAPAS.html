<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Votuporanga - Composto</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-E59KMQFDEK"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-E59KMQFDEK');</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
html,body,#map{height:100%;width:100%;margin:0;padding:0;font-family:Arial,sans-serif}.info-box{position:absolute;z-index:1000;top:10px;left:10px;background:#fff;padding:9px 11px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:13px;line-height:1.35;max-width:300px}.gps-box{position:absolute;z-index:1000;bottom:20px;left:10px;background:#fff;padding:8px 10px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:13px}.btn{display:inline-block;margin-top:6px;padding:7px 10px;background:#222;color:#fff;border:0;border-radius:7px;cursor:pointer;font-weight:bold;font-size:12px}.legend{margin-top:6px;display:grid;grid-template-columns:auto 1fr;gap:4px 6px;align-items:center}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #333}.dot.fin{background:#8B0000}.dot.car{background:#001F54}.dot.t2{background:#FFD400}.dot.t3{background:#40E0D0}.marker-dot{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 3px rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;line-height:16px}.marker-fin{background:#8B0000;color:#fff}.marker-car{background:#001F54;color:#fff}.marker-t2{background:#FFD400;color:#111}.marker-t3{background:#40E0D0;color:#111}.marker-outro{background:#777;color:#fff}.gps-marker{width:18px;height:18px;background:#1976d2;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 5px rgba(25,118,210,.25),0 0 8px rgba(0,0,0,.6)}.loading{font-size:12px;color:#555;margin-top:4px}
</style>
</head>
<body>
<div id="map"></div>
<div class="info-box"><b>Votuporanga - Composto</b><br>Pontos: <span id="totalPontos">0</span><br><span id="statusArea">GPS ainda não iniciado</span><div class="legend"><span class="dot fin"></span><span>FINALIZADO: <b id="totalFinalizado">0</b></span><span class="dot car"></span><span>CARTEIRA: <b id="totalCarteira">0</b></span><span class="dot t2"></span><span>T2: <b id="totalT2">0</b></span><span class="dot t3"></span><span>T3: <b id="totalT3">0</b></span></div><button class="btn" onclick="centralizarGPS()">Minha localização</button><div class="loading" id="loadingInfo">Carregando dados...</div></div>
<div class="gps-box" id="gpsInfo">Aguardando permissão do GPS...</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script>
const ARQUIVOS_POLIGONO=["../DADOS/AREAS_POLIGONOS/ER_REGIAO_Votuporanga_Simonsen.geojson",
  "../DADOS/AREAS_POLIGONOS/ER_REGIAO_Votuporanga_Votuporanga.geojson"];
const ARQUIVOS_PONTOS=["../DADOS/PONTOS_AREA/ER_REGIAO_CIDADE_min_Votuporanga_Votuporanga_Votuporanga.geojson"];
let areasGeojson=[],pontosGeojson=[],gpsMarker=null,gpsCircle=null,lastLatLng=null;
const map=L.map('map',{preferCanvas:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
function normaliza(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();}
function classeIcone(v){const s=normaliza(v);if(s==='FINALIZADO')return['marker-fin','×'];if(s==='CARTEIRA')return['marker-car',''];if(s.includes('T2'))return['marker-t2','2'];if(s.includes('T3'))return['marker-t3','3'];return['marker-outro',''];}
function makeIcon(status){const [cls,txt]=classeIcone(status);return L.divIcon({className:'',html:`<div class="marker-dot ${cls}">${txt}</div>`,iconSize:[20,20],iconAnchor:[10,10],popupAnchor:[0,-10]});}
function nomePonto(p){return p.RAZAOSOCIAL||p.RAZAO_SOCIAL||p.NOMEFANTASIA||p.FANTASIA||'Ponto';}
function enderecoPonto(p){return p.ENDEE||p.ENDERECO||p.ENDERECO_COMPLETO||'';}
function centralizarGPS(){if(lastLatLng)map.setView(lastLatLng,17);}
function dentroDaArea(lat,lng){try{const ponto=turf.point([lng,lat]);return areasGeojson.some(g=>Array.isArray(g.features)&&g.features.some(f=>turf.booleanPointInPolygon(ponto,f)));}catch(e){return false;}}
function atualizarContadores(gs){const fs=gs.flatMap(g=>Array.isArray(g.features)?g.features:[]);let finalizado=0,carteira=0,t2=0,t3=0;fs.forEach(f=>{const s=normaliza((f.properties||{}).O_QUE_FAZER);if(s==='FINALIZADO')finalizado++;else if(s==='CARTEIRA')carteira++;else if(s.includes('T2'))t2++;else if(s.includes('T3'))t3++;});document.getElementById('totalPontos').textContent=fs.length;document.getElementById('totalFinalizado').textContent=finalizado;document.getElementById('totalCarteira').textContent=carteira;document.getElementById('totalT2').textContent=t2;document.getElementById('totalT3').textContent=t3;}
function iniciarGPS(){if(!navigator.geolocation){document.getElementById('gpsInfo').innerHTML='GPS não suportado neste navegador.';return;}navigator.geolocation.watchPosition(pos=>{const lat=pos.coords.latitude,lng=pos.coords.longitude,acc=Math.round(pos.coords.accuracy||0);lastLatLng=L.latLng(lat,lng);if(!gpsMarker){const icon=L.divIcon({className:'',html:'<div class="gps-marker"></div>',iconSize:[24,24],iconAnchor:[12,12]});gpsMarker=L.marker(lastLatLng,{icon}).addTo(map);gpsCircle=L.circle(lastLatLng,{radius:acc,color:'#1976d2',weight:1,fillOpacity:.08}).addTo(map);}else{gpsMarker.setLatLng(lastLatLng);gpsCircle.setLatLng(lastLatLng).setRadius(acc);}const dentro=dentroDaArea(lat,lng);document.getElementById('statusArea').innerHTML=dentro?'🟢 Dentro da área':'🔴 Fora da área';document.getElementById('gpsInfo').innerHTML=`GPS ativo<br>Precisão aproximada: ${acc} m`; },()=>{document.getElementById('gpsInfo').innerHTML='GPS não autorizado ou indisponível.';},{enableHighAccuracy:true,maximumAge:3000,timeout:15000});}
async function carregarMapa(){try{const areaRespostas=await Promise.all(ARQUIVOS_POLIGONO.map(async c=>{const r=await fetch(encodeURI(c));if(!r.ok)throw new Error('Erro ao carregar polígono: '+c);return r.json();}));const pontoRespostas=await Promise.all(ARQUIVOS_PONTOS.map(async c=>{const r=await fetch(encodeURI(c));if(!r.ok)throw new Error('Erro ao carregar pontos: '+c);return r.json();}));areasGeojson=areaRespostas;pontosGeojson=pontoRespostas;const areaGroup=L.featureGroup().addTo(map);areasGeojson.forEach(g=>L.geoJSON(g,{style:{color:'#0b3d91',weight:3,fillColor:'#0b3d91',fillOpacity:.10}}).addTo(areaGroup));if(areaGroup.getBounds().isValid())map.fitBounds(areaGroup.getBounds(),{padding:[20,20]});const markers=L.markerClusterGroup({chunkedLoading:true,maxClusterRadius:45,disableClusteringAtZoom:17});pontosGeojson.forEach(g=>{L.geoJSON(g,{pointToLayer:(f,latlng)=>L.marker(latlng,{icon:makeIcon((f.properties||{}).O_QUE_FAZER)}),onEachFeature:(f,l)=>{const p=f.properties||{},latlng=l.getLatLng?l.getLatLng():null,gmaps=latlng?`https://www.google.com/maps/search/?api=1&query=${latlng.lat},${latlng.lng}`:'#';l.bindPopup(`<b>${nomePonto(p)}</b><br>${enderecoPonto(p)}<br><b>Ação:</b> ${p.O_QUE_FAZER||''}<br><a target="_blank" rel="noopener noreferrer" href="${gmaps}">Abrir no Google Maps</a>`);}}).eachLayer(x=>markers.addLayer(x));});map.addLayer(markers);atualizarContadores(pontosGeojson);document.getElementById('loadingInfo').innerHTML='Dados carregados';iniciarGPS();}catch(e){console.error(e);document.getElementById('loadingInfo').innerHTML='Erro ao carregar dados. Confira os caminhos dos GeoJSON.';map.setView([-20.42,-49.97],11);}}
carregarMapa();
</script>
</body>
</html>
