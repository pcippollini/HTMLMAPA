const map = L.map('map', {preferCanvas:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(map);
const areaLayer = L.geoJSON(areaGeojson, {style:{color:'#0b3d91',weight:3,fillColor:'#0b3d91',fillOpacity:0.10}}).addTo(map);
map.fitBounds(areaLayer.getBounds(), {padding:[20,20]});
function normaliza(v){ return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase(); }
function classeIcone(v){
  const s=normaliza(v);
  if(s==='FINALIZADO') return ['marker-fin','×'];
  if(s==='CARTEIRA') return ['marker-car',''];
  if(s==='T2') return ['marker-t2','2'];
  if(s==='T3') return ['marker-t3','3'];
  return ['marker-outro',''];
}
function makeIcon(status){
  const [cls,txt]=classeIcone(status);
  return L.divIcon({className:'', html:`<div class="marker-dot ${cls}">${txt}</div>`, iconSize:[20,20], iconAnchor:[10,10], popupAnchor:[0,-10]});
}
const markers = L.markerClusterGroup({ chunkedLoading:true, maxClusterRadius:45, disableClusteringAtZoom:17 });
L.geoJSON(pontosGeojson, {
  pointToLayer: function(feature, latlng){
    const p=feature.properties||{};
    return L.marker(latlng, {icon: makeIcon(p.O_QUE_FAZER)});
  },
  onEachFeature: function(feature, layer){
    const p=feature.properties||{};
    const latlng = layer.getLatLng ? layer.getLatLng() : null;
    const gmaps = latlng ? `https://www.google.com/maps/search/?api=1&query=${latlng.lat},${latlng.lng}` : '#';
    layer.bindPopup(`<b>${p.RAZAOSOCIAL || p.NOMEFANTASIA || 'Ponto'}</b><br>${p.ENDEE || ''}<br><b>Ação:</b> ${p.O_QUE_FAZER || ''}<br><a target="_blank" href="${gmaps}">Abrir no Google Maps</a>`);
  }
}).eachLayer(l => markers.addLayer(l));
map.addLayer(markers);
let gpsMarker=null, gpsCircle=null, lastLatLng=null;
function dentroDaArea(lat, lng){
  try { return turf.booleanPointInPolygon(turf.point([lng,lat]), areaGeojson.features[0]); } catch(e){ return false; }
}
function centralizarGPS(){ if(lastLatLng){ map.setView(lastLatLng, 17); } }
function iniciarGPS(){
  if(!navigator.geolocation){ document.getElementById('gpsInfo').innerHTML='GPS não suportado neste navegador.'; return; }
  navigator.geolocation.watchPosition(pos => {
    const lat=pos.coords.latitude, lng=pos.coords.longitude, acc=Math.round(pos.coords.accuracy || 0);
    lastLatLng=L.latLng(lat,lng);
    if(!gpsMarker){
      const icon=L.divIcon({className:'', html:'<div class="gps-marker"></div>', iconSize:[24,24], iconAnchor:[12,12]});
      gpsMarker=L.marker(lastLatLng,{icon}).addTo(map);
      gpsCircle=L.circle(lastLatLng,{radius:acc,color:'#1976d2',weight:1,fillOpacity:.08}).addTo(map);
      map.setView(lastLatLng, 16);
    } else { gpsMarker.setLatLng(lastLatLng); gpsCircle.setLatLng(lastLatLng).setRadius(acc); }
    const dentro=dentroDaArea(lat,lng);
    document.getElementById('statusArea').innerHTML=dentro ? '🟢 Dentro da área' : '🔴 Fora da área';
    document.getElementById('gpsInfo').innerHTML=`GPS ativo<br>Precisão aproximada: ${acc} m`;
  }, err => { document.getElementById('gpsInfo').innerHTML='GPS não autorizado ou indisponível.'; }, {enableHighAccuracy:true, maximumAge:3000, timeout:15000});
}
iniciarGPS();
</script>
