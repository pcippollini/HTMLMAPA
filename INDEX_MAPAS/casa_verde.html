<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mapa Individual - Casa Verde</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef1f3;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    .leaflet-container {
      width: 100%;
      height: 100%;
      background: #eef1f3;
    }

    .topo {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      align-items: stretch;
      pointer-events: none;
    }

    .card-titulo {
      background: rgba(255,255,255,0.96);
      border-radius: 10px;
      padding: 8px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.22);
      min-width: 210px;
      max-width: 360px;
      pointer-events: auto;
    }

    .card-titulo strong {
      display: block;
      font-size: 14px;
      color: #111;
      margin-bottom: 2px;
    }

    .card-titulo span {
      display: block;
      font-size: 11px;
      color: #555;
      line-height: 1.25;
    }

    .botoes {
      margin-left: auto;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      background: #111;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.22);
      white-space: nowrap;
    }

    .btn.sec {
      background: #fff;
      color: #111;
    }

    .legenda {
      position: absolute;
      left: 10px;
      bottom: 22px;
      z-index: 1000;
      background: rgba(255,255,255,0.96);
      border-radius: 10px;
      padding: 8px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.22);
      font-size: 11px;
      color: #222;
      max-width: 260px;
    }

    .legenda .linha {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 4px 0;
      white-space: nowrap;
    }

    .bolinha {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid #333;
    }

    .popup {
      font-size: 12px;
      line-height: 1.35;
      min-width: 210px;
    }

    .popup b { color: #111; }

    .popup a {
      display: inline-block;
      margin-top: 6px;
      padding: 5px 7px;
      border-radius: 7px;
      text-decoration: none;
      color: #fff;
      background: #111;
      font-weight: 700;
      font-size: 11px;
    }

    @media (max-width: 620px) {
      .topo {
        flex-direction: column;
        right: 8px;
        left: 8px;
      }

      .card-titulo {
        max-width: none;
      }

      .botoes {
        margin-left: 0;
      }

      .btn {
        flex: 1;
      }

      .legenda {
        font-size: 10px;
        bottom: 18px;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="topo">
    <div class="card-titulo">
      <strong>MAPA INDIVIDUAL - CASA VERDE</strong>
      <span id="resumo">Carregando pontos e polígono...</span>
    </div>
    <div class="botoes">
      <button class="btn" id="btnGps" type="button">GPS</button>
      <button class="btn sec" id="btnArea" type="button">Ver área</button>
    </div>
  </div>

  <div class="legenda" id="legenda">
    <strong>Legenda - O_QUE_FAZER</strong>
    <div class="linha"><span class="bolinha" style="background:#d71920"></span> FINALIZADO</div>
    <div class="linha"><span class="bolinha" style="background:#1d2f8f"></span> CARTEIRA</div>
    <div class="linha"><span class="bolinha" style="background:#00a9e0"></span> APLICAR T2</div>
    <div class="linha"><span class="bolinha" style="background:#2d4aa5"></span> APLICAR T3 / outros</div>
  </div>

  <script>
    // Arquivos esperados dentro do repositório:
    // HTMLMAPA/INDEX_MAPAS/casa_verde.html
    // HTMLMAPA/DADOS/São Paulo_Casa Verde.geojson     = polígono
    // HTMLMAPA/DADOS/São Paulo_Casa Verdea.geojson    = pontos
    const ARQUIVO_POLIGONO = '../DADOS/São Paulo_Casa Verde.geojson';
    const ARQUIVO_PONTOS = '../DADOS/São Paulo_Casa Verdea.geojson';

    const CORES = {
      'FINALIZADO': '#d71920',
      'CARTEIRA': '#1d2f8f',
      'APLICAR T2': '#00a9e0',
      'T2': '#00a9e0',
      'APLICAR T3': '#2d4aa5',
      'T3': '#2d4aa5'
    };

    const map = L.map('map', {
      zoomControl: true,
      preferCanvas: true
    }).setView([-23.505, -46.655], 14);

    const baseLimpa = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 20,
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    const baseOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    });

    L.control.layers({
      'Mapa leve': baseLimpa,
      'OpenStreetMap': baseOSM
    }, null, { collapsed: true }).addTo(map);

    let camadaPoligono = null;
    let camadaPontos = null;
    let marcadorGps = null;
    let circuloGps = null;
    let boundsGeral = null;
    const resumo = document.getElementById('resumo');

    function texto(v) {
      return (v === undefined || v === null || v === '') ? '-' : String(v);
    }

    function corPorAcao(valor) {
      const chave = texto(valor).trim().toUpperCase();
      return CORES[chave] || '#2d4aa5';
    }

    function popupPonto(feature) {
      const p = feature.properties || {};
      const maps = p.LMAPS || '';
      const lat = p.LATITUDE || '';
      const lng = p.LONGITUDE || '';
      const mapsFallback = lat && lng ? `https://www.google.com/maps?q=${lat},${lng}` : '';
      const link = maps || mapsFallback;

      return `
        <div class="popup">
          <b>CNPJ:</b> ${texto(p.CNPJ)}<br>
          <b>Fantasia:</b> ${texto(p.NOMEFANTASIA)}<br>
          <b>Razão social:</b> ${texto(p.RAZAOSOCIAL)}<br>
          <b>Endereço:</b> ${texto(p.ENDEE)}<br>
          <b>Ação:</b> ${texto(p.O_QUE_FAZER)}<br>
          <b>Agente:</b> ${texto(p.AGENTE)}<br>
          ${link ? `<a href="${link}" target="_blank" rel="noopener">Abrir no Maps</a>` : ''}
        </div>`;
    }

    function popupPoligono(feature) {
      const p = feature.properties || {};
      return `
        <div class="popup">
          <b>Região:</b> ${texto(p.Name)}<br>
          <b>Escritório:</b> ${texto(p.ESCRITORIO_REGIONAL)}
        </div>`;
    }

    async function carregarMapa() {
      try {
        const [respPol, respPts] = await Promise.all([
          fetch(encodeURI(ARQUIVO_POLIGONO), { cache: 'no-store' }),
          fetch(encodeURI(ARQUIVO_PONTOS), { cache: 'no-store' })
        ]);

        if (!respPol.ok) throw new Error('Não carregou o GeoJSON de polígono: ' + ARQUIVO_POLIGONO);
        if (!respPts.ok) throw new Error('Não carregou o GeoJSON de pontos: ' + ARQUIVO_PONTOS);

        const poligono = await respPol.json();
        const pontos = await respPts.json();

        camadaPoligono = L.geoJSON(poligono, {
          style: {
            color: '#111111',
            weight: 2,
            opacity: 0.9,
            fillColor: '#111111',
            fillOpacity: 0.06
          },
          onEachFeature: function(feature, layer) {
            layer.bindPopup(popupPoligono(feature));
          }
        }).addTo(map);

        camadaPontos = L.geoJSON(pontos, {
          pointToLayer: function(feature, latlng) {
            const acao = feature.properties ? feature.properties.O_QUE_FAZER : '';
            const cor = corPorAcao(acao);
            return L.circleMarker(latlng, {
              radius: 5,
              color: '#ffffff',
              weight: 1,
              fillColor: cor,
              fillOpacity: 0.95
            });
          },
          onEachFeature: function(feature, layer) {
            layer.bindPopup(popupPonto(feature));
          }
        }).addTo(map);

        boundsGeral = camadaPoligono.getBounds();
        if (camadaPontos.getBounds().isValid()) {
          boundsGeral.extend(camadaPontos.getBounds());
        }

        if (boundsGeral && boundsGeral.isValid()) {
          map.fitBounds(boundsGeral, { padding: [28, 28] });
        }

        const totalPontos = pontos.features ? pontos.features.length : 0;
        const totalPoligonos = poligono.features ? poligono.features.length : 0;
        resumo.textContent = `${totalPontos} pontos | ${totalPoligonos} polígono | base leve`;

        setTimeout(function () {
          map.invalidateSize();
        }, 300);
      } catch (erro) {
        console.error(erro);
        resumo.textContent = 'Erro ao carregar arquivos. Confira os nomes e a pasta DADOS.';
        alert('Erro ao carregar o mapa. Confira se os GeoJSON estão em HTMLMAPA/DADOS e se os nomes são idênticos ao código.');
      }
    }

    function localizarUsuario() {
      if (!navigator.geolocation) {
        alert('GPS não disponível neste navegador.');
        return;
      }

      resumo.textContent = 'Buscando localização pelo GPS...';

      navigator.geolocation.getCurrentPosition(function(pos) {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const precisao = pos.coords.accuracy || 0;
        const latlng = [lat, lng];

        if (marcadorGps) map.removeLayer(marcadorGps);
        if (circuloGps) map.removeLayer(circuloGps);

        marcadorGps = L.marker(latlng).addTo(map).bindPopup(
          `<div class="popup"><b>Sua localização</b><br>Precisão aproximada: ${Math.round(precisao)} m</div>`
        ).openPopup();

        circuloGps = L.circle(latlng, {
          radius: precisao,
          color: '#111111',
          weight: 1,
          fillColor: '#111111',
          fillOpacity: 0.08
        }).addTo(map);

        map.setView(latlng, 17);

        if (camadaPontos && camadaPoligono) {
          const totalPontos = camadaPontos.getLayers().length;
          resumo.textContent = `${totalPontos} pontos | GPS localizado`;
        } else {
          resumo.textContent = 'GPS localizado';
        }
      }, function() {
        resumo.textContent = 'GPS não autorizado ou indisponível.';
        alert('Não foi possível obter a localização. Verifique se o GPS/localização está liberado para este site.');
      }, {
        enableHighAccuracy: true,
        timeout: 12000,
        maximumAge: 0
      });
    }

    document.getElementById('btnGps').addEventListener('click', localizarUsuario);
    document.getElementById('btnArea').addEventListener('click', function() {
      if (boundsGeral && boundsGeral.isValid()) {
        map.fitBounds(boundsGeral, { padding: [28, 28] });
        setTimeout(function () { map.invalidateSize(); }, 200);
      }
    });

    window.addEventListener('resize', function() {
      setTimeout(function () { map.invalidateSize(); }, 200);
    });

    setTimeout(function () { map.invalidateSize(); }, 500);
    carregarMapa();
  </script>
</body>
</html>
